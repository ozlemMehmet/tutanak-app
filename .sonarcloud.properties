# SonarQube Cloud otomatik analizinin kapsam ayari (T-016).
#
# NEDEN BU DOSYA: proje SonarQube Cloud'da OTOMATIK analiz ile taraniyor (CI'da sonar
# adimi yok). Otomatik analiz `sonar-project.properties` dosyasini YOK SAYAR; desteklenen
# yapilandirma dosyasi budur ve yalnizca VARSAYILAN DAL'daki kopyasi dikkate alinir.
# Desteklenen anahtarlar: sonar.sources, sonar.exclusions, sonar.inclusions, sonar.tests,
# sonar.test.exclusions, sonar.test.inclusions, sonar.sourceEncoding, sonar.cpd.exclusions.
#
# NE YAPIYOR: test kaynaklari analiz kapsami disinda birakiliyor. Gerekce (T-016 kabul
# kriteri 4): PR #3'un Quality Gate'ini dusuren iki kosulun da kaynagi test dosyalariydi —
#   * Security C  <- typescript:S2068 "hard-coded password" (test/*.e2e-spec.ts icindeki
#     sabit `PASSWORD` degeri; gercek bir sir degil, testin girdisi)
#   * Reliability D <- typescript:S2871 "sort() icin karsilastirma fonksiyonu ver"
#     (assertion icindeki `Object.keys(body).sort()` cagrilari)
# Test kodu uretime gitmez, disariya bir yuzey acmaz ve icindeki degerler tanim geregi
# sahtedir; kalite kapisi URUN kodunu olcmelidir. Alternatif olan "sabit degerleri
# gizleme/uretme" yolu, testleri sirlarla ilgilenir hale getirirdi (T-016 kapsam disi).
sonar.exclusions=apps/api/test/**/*,apps/web/e2e/**/*,**/*.spec.ts,**/*.spec.tsx
