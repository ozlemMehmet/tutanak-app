# Yerel calistirma: `cp .env.example .env && docker compose up` (CLAUDE.md §10).
# db/minio/mailpit servisleri sonraki ticketlar (T-002+) icin hazir bekler; T-001 iskeleti
# yalnizca api ve web servislerini fiilen kullanir.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutanak
      POSTGRES_PASSWORD: tutanak
      POSTGRES_DB: tutanak
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutanak']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # T-006: fotograf kovasi acilista bir kez olusturulur; aksi halde ilk yukleme
  # 502 STORAGE_UNAVAILABLE ile doner ve `docker compose up` sonrasi akis tamamlanmaz.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      sh -c "until mc alias set yerel http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing yerel/${R2_BUCKET:-tutanak-photos}"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Acilista once migration + sablon seed, sonra watch modunda sunucu (CLAUDE.md §10).
    command: >-
      sh -c "npm run migrate:deploy --workspace @tutanak/api &&
      npm run seed --workspace @tutanak/api &&
      npm run start:dev --workspace @tutanak/api"
    # JWT_SECRET gibi sirlar/ayarlar .env dosyasindan gelir (CLAUDE.md §5, §10:
    # `cp .env.example .env` adimi bunun icindir). DATABASE_URL asagida container
    # agina gore EZILIR; env_file'daki yerel adres host icindir.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tutanak:tutanak@db:5432/tutanak
      # .env'deki adres host icindir; container aginda servis adi kullanilir.
      R2_ENDPOINT: http://minio:9000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/node_modules

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev --workspace @tutanak/web -- --host"
    environment:
      # T-006: tarayici API'yi ayni kaynakta (`/api/v1`) gorur; Vite vekili container
      # aginda servis adina yonlendirir (CORS gerekmez).
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

volumes:
  db-data:
  minio-data:
  api-node-modules:
  web-node-modules:
