# Yerel calistirma: `cp .env.example .env && docker compose up` (CLAUDE.md §10).
# db/minio/mailpit servisleri sonraki ticketlar (T-002+) icin hazir bekler; T-001 iskeleti
# yalnizca api ve web servislerini fiilen kullanir.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutanak
      POSTGRES_PASSWORD: tutanak
      POSTGRES_DB: tutanak
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutanak']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Acilista once migration + sablon seed, sonra watch modunda sunucu (CLAUDE.md §10).
    command: >-
      sh -c "npm run migrate:deploy --workspace @tutanak/api &&
      npm run seed --workspace @tutanak/api &&
      npm run start:dev --workspace @tutanak/api"
    environment:
      DATABASE_URL: postgresql://tutanak:tutanak@db:5432/tutanak
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - api-node-modules:/app/node_modules

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev --workspace @tutanak/web -- --host"
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

volumes:
  db-data:
  minio-data:
  api-node-modules:
  web-node-modules:
