name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + migrate + test + build
    runs-on: ubuntu-latest

    # T-002: migration ve entegrasyon testleri gercek bir Postgres 16 uzerinde kosar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutanak
          POSTGRES_PASSWORD: tutanak
          POSTGRES_DB: tutanak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutanak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tutanak:tutanak@localhost:5432/tutanak

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Prisma istemcisini uret
        run: npm run prisma:generate --workspace @tutanak/api

      - name: Bicim kontrolu
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Prisma sema dogrulamasi
        run: npm run prisma:validate --workspace @tutanak/api

      - name: Sema-migration sapma kontrolu
        working-directory: apps/api
        run: |
          # Golge veritabani prisma CLI ile olusturulur (kosucuda psql varligina bel baglanmaz).
          echo 'CREATE DATABASE tutanak_shadow;' | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://tutanak:tutanak@localhost:5432/tutanak_shadow" \
            --exit-code

      - name: Veritabani migration (deploy)
        run: npm run migrate:deploy --workspace @tutanak/api

      - name: Sablon seed
        run: npm run seed --workspace @tutanak/api

      - name: Birim testleri
        run: npm run test

      - name: Entegrasyon/e2e testleri
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: PWA build dogrulamasi (manifest + service worker)
        run: npm run verify:pwa

      - name: Bagimlilik zafiyet taramasi
        run: npm audit --audit-level=high
